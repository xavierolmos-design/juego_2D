<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>¡Bendiciones en este mundo! · Axel RPG</title>
    <style>
        :root {
            --g: #ffd36b;
            --p: rgba(14, 18, 36, .9);
            --l: rgba(255, 211, 107, .45)
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #85c7f2;
            color: #f5f2e9;
            font-family: Georgia, serif
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%
        }

        .p {
            position: fixed;
            z-index: 3;
            background: var(--p);
            border: 1px solid var(--l);
            border-radius: 12px;
            padding: 11px;
            backdrop-filter: blur(8px)
        }

        h1 {
            margin: 0 0 6px;
            font-size: 16px;
            color: var(--g)
        }

        h3 {
            margin: 0 0 6px;
            color: var(--g)
        }

        p {
            margin: 0
        }

        small {
            color: #bdc7d5;
            font-size: 12px
        }

        label {
            display: block;
            font-size: 12px;
            margin: 7px 0 2px
        }

        input,
        select {
            width: 100%
        }

        input[type=color] {
            height: 26px;
            border: 0;
            background: none
        }

        button {
            border: 1px solid #b68a43;
            background: linear-gradient(#805b2d, #51391f);
            color: #fff2d3;
            padding: 7px 9px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            margin: 4px 3px 0 0
        }

        button:hover {
            filter: brightness(1.25)
        }

        #custom {
            top: 10px;
            left: 10px;
            width: 220px;
            max-height: calc(100% - 20px);
            overflow: auto
        }

        #hud {
            top: 10px;
            right: 10px;
            width: 230px
        }

        #quest {
            top: 178px;
            right: 10px;
            width: 230px;
            font-size: 13px
        }

        #skills {
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            padding: 8px
        }

        .bar {
            height: 9px;
            background: #293346;
            border-radius: 8px;
            overflow: hidden;
            margin: 2px 0 6px
        }

        .bar i {
            display: block;
            height: 100%
        }

        .row {
            display: flex;
            justify-content: space-between;
            font-size: 12px
        }

        #chant {
            position: fixed;
            z-index: 5;
            top: 22%;
            width: 100%;
            text-align: center;
            font-size: clamp(18px, 3.4vw, 34px);
            color: #ffb340;
            text-shadow: 0 0 14px #ff4a10, 0 2px 0 #000;
            display: none;
            pointer-events: none;
            font-style: italic
        }

        #dlg {
            display: none;
            z-index: 6;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: min(520px, 92vw);
            border: 2px solid var(--g);
            text-align: center
        }

        #toast {
            position: fixed;
            z-index: 8;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            background: #171d2de8;
            border: 1px solid var(--g);
            border-radius: 9px;
            padding: 9px 15px;
            display: none;
            font: 13px Arial
        }

        #flash {
            position: fixed;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 7
        }

        #fl {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 4
        }

        .f,
        .tag {
            position: absolute;
            transform: translate(-50%, -50%);
            font: bold 16px Arial;
            text-shadow: 0 2px 3px #000;
            white-space: nowrap
        }

        .tag {
            font: 11px Arial;
            color: #fff;
            background: #0009;
            padding: 2px 6px;
            border-radius: 6px
        }

        .hint {
            position: fixed;
            left: 10px;
            bottom: 10px;
            z-index: 2;
            padding: 8px 10px;
            background: #0c142acc;
            border-radius: 8px;
            font: 12px/1.5 Arial
        }

        @media(max-width:760px) {
            #custom {
                width: 170px
            }

            #hud,
            #quest {
                width: 170px
            }

            .hint {
                display: none
            }

            #skills {
                flex-wrap: wrap;
                width: 92vw;
                bottom: 4px
            }
        }
    </style>
</head>

<body>
    <canvas id="gl"></canvas>
    <div id="flash"></div>
    <div id="fl"></div>
    <div id="chant"></div>
    <section id="custom" class="p">
        <h1>✦ Gremio de Axel</h1><small>Personaliza a tu aventurero [C]</small>
        <label>Altura</label><input id="height" type="range" min=".8" max="1.3" step=".05" value="1">
        <label>Anchura</label><input id="width" type="range" min=".8" max="1.3" step=".05" value="1">
        <label>Piel</label><input id="skin" type="color" value="#f2bf9c"><label>Cabello</label><input id="hair"
            type="color" value="#6b4a2f">
        <label>Armadura</label><input id="armor" type="color" value="#3f7a5c">
        <label>Sombrero</label><select id="hat">
            <option value="none">Ninguno</option>
            <option value="wizard">Sombrero de bruja</option>
            <option value="helmet">Yelmo</option>
        </select>
        <label>Capa</label><select id="cape">
            <option value="none">Sin capa</option>
            <option value="#3f9a5c">Verde aventurero</option>
            <option value="#a52e3b">Carmesí</option>
            <option value="#244e9a">Azul real</option>
        </select>
        <label>Clase</label><select id="cls">
            <option value="mage">Archimago — Explosión</option>
            <option value="warrior">Cruzado — Golpe sísmico</option>
            <option value="shadow">Monarca de Sombras — ¡ARISE!</option>
            <option value="samurai">Samurái — Iaido Lunar</option>
            <option value="ninja">Kunoichi — Clones</option>
            <option value="star">Maga Estelar — Rayo Estelar</option>
            <option value="archer">Arquera Élfica — Flecha Celestial</option>
        </select>
    </section>
    <section id="hud" class="p">
        <h1 id="cn">Archimago · Nv 1</h1>
        <div class="row"><span id="hpt"></span><span>♥ Salud</span></div>
        <div class="bar"><i id="hpb" style="background:#d64e54"></i></div>
        <div class="row"><span id="mpt"></span><span>✦ Maná</span></div>
        <div class="bar"><i id="mpb" style="background:#4c8fe0"></i></div>
        <div class="row"><span id="xpt"></span><span>XP</span></div>
        <div class="bar"><i id="xpb" style="background:#e9b94c"></i></div>
        <div class="row"><b id="eris" style="color:#ffd36b"></b><span id="pts"></span></div>
    </section>
    <section id="quest" class="p"><b style="color:#ffd36b">📜 Misión</b>
        <div id="qt">Habla con Liria en el gremio.</div>
    </section>
    <section id="stat" class="p" style="top:262px;right:10px;width:230px">
        <div id="spt" style="font-size:12px;color:#ffd36b"></div><button data-s="str"></button><button

    </section>
    <section id="skills" class="p"><button id="b1">Ataque [Espacio]</button><button id="b2">Explosión
            [Q]</button><button id="b5">Habilidad [R]</button><button id="b3">Bendición [F]</button><button
            id="b4">Mejorar</button></section>
    <div class="hint">WASD mover · Shift correr · Ratón arrastrar: cámara · Espacio ataque · Q habilidad definitiva · F

    <div id="dlg" class="p">

        <p id="dt"></p>
        <div id="db"></div>
    </div>
    <div id="toast"></div>
